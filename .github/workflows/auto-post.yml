name: Auto-Post Agent

# NOTE: the unattended schedule is intentionally removed.
#
# Publishing AI-drafted articles on a fixed cadence with no human in the loop is
# exactly the pattern Google's spam policy calls "scaled content abuse", and it
# is the primary reason this site was failing AdSense review. This workflow is
# now manual-only: a human triggers it, reviews the resulting PR, verifies the
# method, and merges. Draft volume is no longer automatic.
#
# Do NOT re-add a `schedule:` trigger here.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: force a specific topic (skips Pinterest)"
        required: false
        type: string
      dry_run:
        description: "Dry run (no Claude/Gemini spend, no PR)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name  "auto-post-agent[bot]"
          git config user.email "auto-post-agent@users.noreply.github.com"

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ -n "${{ inputs.topic }}" ]; then
            FLAGS="$FLAGS --topic=\"${{ inputs.topic }}\""
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          eval node scripts/agent/run.mjs $FLAGS
